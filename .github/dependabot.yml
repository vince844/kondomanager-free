# Aggiornamenti delle dipendenze proposti da Dependabot, una volta alla settimana e raggruppati
# per ecosistema, così che arrivi una richiesta sola e non una per pacchetto. Dependabot legge
# questo file solo dal ramo predefinito: vale da quando il ramo di versione è unito a main.
# Gli avvisi di sicurezza (security updates) si attivano nelle impostazioni del repository.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      php:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      javascript:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      azioni:
        patterns: ['*']
