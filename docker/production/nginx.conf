server {
    listen 80;
    root /var/www/public;
    index index.php;

    # Senza questa riga nginx si ferma a 1 MB (il suo default) e risponde 413 prima che PHP veda
    # la richiesta: nessuno dei messaggi dell'applicazione arriverebbe mai all'utente. Va tenuta
    # coerente con `post_max_size` in docker/production/php.ini e con il tetto di
    # App\Support\LimiteCaricamento. Aggiunta nella beta.58 dopo una segnalazione dal forum.
    client_max_body_size 30M;   # sopra `post_max_size` (25M), non uguale: a parità di valore
                                # scarta sempre nginx per primo, con la sua 413 spoglia, e la
                                # pagina d'errore del programma non si vede mai.

    # Il log di accesso va sullo stdout del container (lo raccoglie Docker/Coolify), non su file:
    # in un'immagine immutabile un file di log cresce finché il container non viene ricreato.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Il fastcgi_params di Debian (dall'aggiornamento di sicurezza del 2025) passa
        # HTTP_HOST = $host, cioè il nome SENZA la porta. Laravel costruisce gli URL degli asset e
        # dei redirect da HTTP_HOST: su un'installazione esposta su una porta non standard
        # (docker run -p 8080:80) la pagina chiede gli script a http://host/ invece che a
        # http://host:8080/ e resta bianca. $http_host è l'intestazione così com'è arrivata, porta
        # inclusa. Dietro un reverse proxy (Traefik, Coolify) l'host è già stato validato dal
        # router prima di arrivare qui. Verificato il 17/09/2026 sull'immagine costruita.
        fastcgi_param HTTP_HOST $http_host;
        # Le stampe lunghe (mpdf) e l'importatore possono superare i 60 s di default: allineato a
        # max_execution_time di php.ini, così è PHP a decidere il limite, non nginx con un 504.
        fastcgi_read_timeout 130;
    }

    # Nessun file nascosto servito dalla web root (.htaccess, .git, .env non ci sono, ma la regola
    # vale a prescindere).
    location ~ /\. { deny all; }
}
