; Limiti di caricamento — i tre valori della catena devono concordare, altrimenti vince il più
; basso e l'utente riceve un errore che non spiega niente (beta.58, segnalazione dal forum):
;
;   nginx  client_max_body_size 30M   ← il tetto dell'intera richiesta (docker/production/nginx.conf)
;   php    post_max_size        25M   ← idem, lato PHP: deve stare sopra upload_max_filesize
;   php    upload_max_filesize  20M   ← il singolo file, ed è il numero che l'utente vede
;
; App\Support\LimiteCaricamento legge i due valori PHP e mostra il più basso; quello di nginx non è
; leggibile da PHP, ed è la ragione per cui va tenuto più alto degli altri due invece che uguale.
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
memory_limit = 256M

; OPcache: l'immagine è immutabile, il codice non cambia mai a container acceso. Non controllare
; i timestamp dei file toglie una stat() per ogni file incluso a ogni richiesta; un'immagine nuova
; è un container nuovo, e la cache riparte da zero comunque.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Il log di PHP va sullo stderr del container.
error_log = /dev/stderr
log_errors = On
display_errors = Off
expose_php = Off

; Niente argomenti nelle tracce delle eccezioni (è il valore di php.ini-production, che
; l'immagine ufficiale non applica): un frame che porta una password — la creazione
; dell'amministratore al primo avvio, per dirne uno — non deve finire nel log del container.
zend.exception_ignore_args = On
