; Supervisor dell'immagine di produzione: un solo container, quattro processi, ognuno riavviato da
; solo se muore. Non è lo stesso file di docker/supervisord.conf (stack di sviluppo): quello apre
; un'interfaccia HTTP di supervisor con credenziali di default, che qui non esiste.
;
; Tutti i log vanno su stdout/stderr del container: è Docker (o Coolify) a raccoglierli, non un
; file in storage/logs che in un'immagine immutabile crescerebbe fino alla ricreazione.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

; Socket locale, solo per `supervisorctl status` da dentro il container (docker exec). Nessuna
; porta HTTP.
[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --max-time fa uscire il worker ogni ora e supervisor lo riavvia: in un'immagine immutabile non
; c'è codice nuovo da caricare, ma limita la deriva di memoria di un processo PHP di lunga durata.
; --memory è il tetto oltre il quale il worker si ferma da solo dopo il job corrente (mpdf e
; l'importatore arrivano a 200–300 MB per singolo job).
[program:queue-worker]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600 --memory=256
user=www-data
autostart=true
autorestart=true
priority=30
startsecs=5
stopwaitsecs=95
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php /var/www/artisan schedule:work
user=www-data
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
