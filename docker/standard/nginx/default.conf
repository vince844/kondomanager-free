server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;

    # Senza questa riga nginx si ferma a 1 MB (il suo default) e risponde 413 prima che PHP veda la
    # richiesta. Va tenuta coerente con `post_max_size` di php.ini e più alta di
    # `upload_max_filesize`, che è il numero mostrato all'utente. Aggiunta nella beta.58.
    client_max_body_size 30M;   # ⚠️ sopra `post_max_size` (25M), non uguale: a parità di valore
                                # scarta sempre nginx per primo, con la sua 413 spoglia, e la
                                # pagina d'errore del programma non si vede mai. Ripasso .58.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}