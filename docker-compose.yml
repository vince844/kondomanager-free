# Stack di sviluppo, da usare sul proprio computer: l'ambiente è `local`, il debug è acceso e le
# password sono quelle di sviluppo (MySQL root/root, Supervisor admin/password, amministratore
# admin@km.com/password). Per questo ogni porta è pubblicata solo su `127.0.0.1`: senza l'indirizzo
# davanti, Docker la apre su tutte le interfacce, e MySQL con `root`/`root` risponderebbe a chiunque
# sia sulla stessa rete. Per usare la stack da un altro dispositivo (il telefono sulla porta 8889)
# si toglie il prefisso a quella porta, sapendo che la raggiunge chiunque sia sulla rete.
# Per usare KondoManager, non per svilupparlo, c'è l'immagine di produzione: vedi docs/docker_local_dev.it.md.
services:
  app:
    build:
      context: .
      dockerfile: docker/standard/Dockerfile
    container_name: kondo_app
    volumes:
      - ./:/var/www
    depends_on:
      - db

  worker:
    build:
      context: .
      dockerfile: docker/standard/Dockerfile
    container_name: kondo_worker
    volumes:
      - ./:/var/www
    ports:
      - "127.0.0.1:9001:9001"
    entrypoint: ["/var/www/docker/standard/worker-entrypoint.sh"]
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: kondo_nginx
    ports:
      - "127.0.0.1:8889:80"
    volumes:
      - ./:/var/www
      - ./docker/standard/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: kondo_db
    environment:
      MYSQL_DATABASE: kondomanager_dev
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  # `storage/app` tiene documenti caricati, backup e allegati: senza un volume con un nome vivrebbe
  # nel livello scrivibile del contenitore e sparirebbe alla sua ricreazione. In questo compose la
  # cartella arriva già dal bind mount `./:/var/www`, quindi il volume serve a chi parte da qui per
  # un deploy vero. Su Coolify va dichiarato nel pannello: `kondomanager:verifica-persistenza` lo dice.
  storage_app:

  dbdata: