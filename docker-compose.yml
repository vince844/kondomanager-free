services:
  app:
    build:
      context: .
      dockerfile: docker/standard/Dockerfile
    container_name: kondo_app
    volumes:
      - ./:/var/www
    depends_on:
      - db

  worker:
    build:
      context: .
      dockerfile: docker/standard/Dockerfile
    container_name: kondo_worker
    volumes:
      - ./:/var/www
    ports:
      - "9001:9001"
    entrypoint: ["/var/www/docker/standard/worker-entrypoint.sh"]
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: kondo_nginx
    ports:
      - "8889:80"
    volumes:
      - ./:/var/www
      - ./docker/standard/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: kondo_db
    environment:
      MYSQL_DATABASE: kondomanager_dev
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: